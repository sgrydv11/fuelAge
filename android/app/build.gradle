plugins {
    id 'com.android.application' version '8.9.2'
}

android {
    namespace 'com.fuelage.tracker'
    compileSdk 35
    defaultConfig {
        applicationId 'com.fuelage.tracker'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    sourceSets.main.assets.srcDir rootProject.file('../dist')
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
